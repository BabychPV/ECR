# Доказовий конвеєр (писався для двовузлового процесу PK1/PK2, скасованого
# 2026-09-08; сам конвеєр чинний).
#
# ⛔ Імена джобів — ЧАСТИНА КОНТРАКТУ. «Готово, коли» у настановах виражається
# саме ними, і захист гілки `main` вимагає рівно цих трьох. Перейменувати джоб
# = зламати всі відкриті настанови одночасно.
#
# ⚠ Тут було ще два сторожі — `scope-guard` і `contracts-guard`. Обидва
# трималися на GitHub Issues: читали `Closes #N`, розбирали `scope:` з тіла
# issue, дивилися на мітку `type:contract`. Керуючий шар на issues скасовано
# (його замінив обмін через гілку `sync`, скасований і сам 2026-09-08), тому
# сторожі пішли разом із ним. Лишився один — `honesty-guard`.
# ⛔ Один із них до того ж завалив правомірну роботу: `contracts-guard` брав
# теку `contracts/` цілим каталогом і зупинив PR за дописування журналу
# знахідок. Сторож, який зупиняє правомірну роботу, вчить обходити себе.
#
# Розподіл із наявним `ci.yml`:
#   ci.yml    — важкі перевірки: SQL Server у контейнері, інтеграційні тести,
#               розгортання під sqlcmd, клієнт, доступність. Іде довго.
#   evidence.yml — швидкі бар'єри процесу: збірка, юніт-тести і сторож чесності,
#               яких машина може перевірити за хвилини. Саме вони гейтують PR.
# Обидва потрібні: перший доводить, що система працює; другий — що процес не
# обходять.

name: Evidence

on:
  push:
    branches: [dev/integration, 'lane/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # ✎ 2026-09-29 (пряме рішення людини): для push у dev/integration група за SHA — GitHub тримає в групі лише один очікуваний прогін, і новий витісняв попередній; тепер кожен пуш має свій вердикт
  # ✎ 2026-10-09 (D-335, L10-09): PR з dev/integration більше не має окремої групи — такий PR забороняє `pr-source`.
  group: evidence-${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') && github.sha || (github.event.pull_request.number || github.ref) }}
  # ✎ 2026-09-29 (пряме рішення людини): на dev/integration — не скасовувати,
  # щоб кожен пуш отримав власний вердикт; на lane/** — скасовувати, як і раніше.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: build
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore Ecr.sln
      - name: build
        # `--no-incremental` навмисно: інкрементна збірка показує стан МИНУЛОЇ
        # компіляції і виглядає як стан дерева. На цьому вже один раз
        # загубилося попередження про невикористану залежність, яке вказувало
        # на відсутню перевірку прав.
        run: dotnet build Ecr.sln -c Release --no-incremental --no-restore

  test:
    name: test
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore Ecr.sln
      - name: build
        # ⛔ Збірка ТУТ, а не з джоба `build`: джоби йдуть на різних раннерах і
        # результату один одного не бачать. Перша редакція мала `--no-build`
        # без цього кроку — і `dotnet test` падав повідомленням
        # «The argument <dll> is invalid», яке про справжню причину не каже
        # нічого. Так само робить робочий `ci.yml`: спершу «Складання», потім
        # «Тести .NET», в одному завданні.
        run: dotnet build Ecr.sln -c Release --no-restore
      - name: test
        # Інтеграційні виключені СВІДОМО: вони вимагають SQL Server і живуть у
        # `ci.yml`, де контейнер піднімається кроком. Тут — швидкий гейт, який
        # має відповідати за хвилини, інакше його почнуть обходити.
        run: >
          dotnet test Ecr.sln -c Release --no-build --no-restore
          --filter "Category!=Integration"
          --logger 'console;verbosity=normal'

  honesty-guard:
    name: honesty-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # ⛔ На push (lane/**) у події немає pull_request.*, і сторож отримував
      # порожні BASE/HEAD: `git diff "..."` давав порожній diff, а скрипт
      # виходив нулем — зелений гейт, що нічого не перевірив. Тому на push і
      # workflow_dispatch база — merge-base з dev/integration (історія є:
      # fetch-depth: 0; на самій dev/integration база = вершина, і порожній
      # diff там чесний), а
      # порожня чи неіснуюча база — падіння, а не «змін у .cs немає».
      - name: honesty
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD_SHA="$PUSH_SHA"
            BASE_SHA="$(git merge-base origin/dev/integration "$HEAD_SHA" || true)"
            # push у dev/integration: merge-base = сама вершина (порожній diff, хибно зелений); база - попередня вершина
            if [ "$GITHUB_REF" = "refs/heads/dev/integration" ] && [ "$EVENT_NAME" = "push" ]; then
              BASE_SHA="$BEFORE_SHA"
              case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="";; esac
            fi
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::honesty-guard: порожня база або вершина (подія $EVENT_NAME, BASE_SHA='${BASE_SHA:-}', HEAD_SHA='${HEAD_SHA:-}'). Без бази сторож нічого не перевіряє — це падіння, а не зелений."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::honesty-guard: коміт $sha відсутній у чекауті — diff був би порожнім і гейт хибно зеленим."
              exit 1
            fi
          done
          echo "honesty-guard: $EVENT_NAME, база $BASE_SHA, вершина $HEAD_SHA"
          export BASE_SHA HEAD_SHA
          bash .github/guards/honesty-guard.sh

  # ✎ 2026-10-12 (CI-швидкість): атестація на PR `rc/**` → `main` — те саме завдання, що й
  # `attest` у `ci.yml` (пояснення там). На такому PR справжні `build`/`test` пропущені
  # (протилежна умова на `head_ref`), а це завдання з ТИМИ САМИМИ іменами перевіряє, що на тому
  # ж head SHA є завершений зелений повний прогін цього workflow на події не-PR.
  # `honesty-guard` НЕ атестується: він дешевий, а на PR перевіряє diff усього тижня проти
  # `main`, чого push-прогін не робить.
  attest:
    name: ${{ matrix.check }}
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        check: [ 'build', 'test' ]
    steps:
      - name: Є зелений повний прогін на цьому SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ matrix.check }}
          WORKFLOW_FILE: evidence.yml
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ATTEST_WAIT_MIN: '20'
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::атестація «$CHECK»: порожній head SHA PR."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::атестація «$CHECK»: PR із форка ($HEAD_REPO) — повний CI на чужому SHA не атестується."
            exit 1
          fi
          deadline=$(( $(date +%s) + ATTEST_WAIT_MIN * 60 ))
          while true; do
            : > found.jsonl
            runs="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch" or .event == "schedule" or (.event == "pull_request" and ((.head_branch | startswith("rc/")) | not))) | .id')"
            for run_id in $runs; do
              gh api --paginate "repos/$REPO/actions/runs/$run_id/jobs?per_page=100&filter=latest" \
                | jq -c --arg n "$CHECK" '.jobs[] | select(.name == $n) | {run_id, status, conclusion, completed_at, url: .html_url}' >> found.jsonl
            done
            latest="$(jq -rs '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out"))] | sort_by(.completed_at) | last // empty | "\(.conclusion) \(.url)"' found.jsonl)"
            pending="$(jq -s '[.[] | select(.status != "completed")] | length' found.jsonl)"
            total="$(jq -s 'length' found.jsonl)"
            case "$latest" in
              success*)
                echo "атестація «$CHECK»: на SHA $HEAD_SHA є зелений повний прогін — ${latest#success }"
                exit 0
                ;;
            esac
            if [ "$pending" -gt 0 ] && [ "$(date +%s)" -lt "$deadline" ]; then
              echo "повний прогін «$CHECK» на $HEAD_SHA ще йде ($pending у процесі) — чекаю 90 с"
              sleep 90
              continue
            fi
            break
          done
          echo "::error::немає зеленого повного прогону «$CHECK» на SHA $HEAD_SHA (знайдено завдань: $total, у процесі: $pending, останній завершений: ${latest:-немає}); запусти lane/integ-… з цим SHA або workflow_dispatch на ньому, а потім перезапусти цю перевірку."
          exit 1
