# Доказовий конвеєр (писався для двовузлового процесу PK1/PK2, скасованого
# 2026-09-08; сам конвеєр чинний).
#
# ⛔ Імена джобів — ЧАСТИНА КОНТРАКТУ. «Готово, коли» у настановах виражається
# саме ними, і захист гілки `main` вимагає рівно цих трьох. Перейменувати джоб
# = зламати всі відкриті настанови одночасно.
#
# ⚠ Тут було ще два сторожі — `scope-guard` і `contracts-guard`. Обидва
# трималися на GitHub Issues: читали `Closes #N`, розбирали `scope:` з тіла
# issue, дивилися на мітку `type:contract`. Керуючий шар на issues скасовано
# (його замінив обмін через гілку `sync`, скасований і сам 2026-09-08), тому
# сторожі пішли разом із ним. Лишився один — `honesty-guard`.
# ⛔ Один із них до того ж завалив правомірну роботу: `contracts-guard` брав
# теку `contracts/` цілим каталогом і зупинив PR за дописування журналу
# знахідок. Сторож, який зупиняє правомірну роботу, вчить обходити себе.
#
# Розподіл із наявним `ci.yml`:
#   ci.yml    — важкі перевірки: SQL Server у контейнері, інтеграційні тести,
#               розгортання під sqlcmd, клієнт, доступність. Іде довго.
#   evidence.yml — швидкі бар'єри процесу: збірка, юніт-тести і сторож чесності,
#               яких машина може перевірити за хвилини. Саме вони гейтують PR.
# Обидва потрібні: перший доводить, що система працює; другий — що процес не
# обходять.

name: Evidence

on:
  push:
    branches: [dev/integration, 'lane/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # ✎ 2026-09-29 (пряме рішення людини): для dev/integration і #463 група за SHA — GitHub тримає в групі лише один очікуваний прогін, і новий витісняв попередній; тепер кожен пуш має свій вердикт
  # ✎ 2026-09-30: умова не за номером PR, а за pull_request з гілки dev/integration — номер PR змінюється після кожного мержу (#463→#464)
  group: evidence-${{ (github.event_name == 'pull_request' && github.head_ref == 'dev/integration' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.sha || (github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') && github.sha || (github.event.pull_request.number || github.ref) }}
  # ✎ 2026-09-29 (пряме рішення людини): на dev/integration і PR #463 — не скасовувати,
  # щоб кожен пуш отримав власний вердикт; на lane/** — скасовувати, як і раніше.
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev/integration' && github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # CI-concurrency 2026-10-01: PR dev/integration -> main не дублює push-прогін тієї ж вершини (ті самі імена контекстів, статуси за SHA).
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev/integration' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore Ecr.sln
      - name: build
        # `--no-incremental` навмисно: інкрементна збірка показує стан МИНУЛОЇ
        # компіляції і виглядає як стан дерева. На цьому вже один раз
        # загубилося попередження про невикористану залежність, яке вказувало
        # на відсутню перевірку прав.
        run: dotnet build Ecr.sln -c Release --no-incremental --no-restore

  test:
    name: test
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev/integration' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore Ecr.sln
      - name: build
        # ⛔ Збірка ТУТ, а не з джоба `build`: джоби йдуть на різних раннерах і
        # результату один одного не бачать. Перша редакція мала `--no-build`
        # без цього кроку — і `dotnet test` падав повідомленням
        # «The argument <dll> is invalid», яке про справжню причину не каже
        # нічого. Так само робить робочий `ci.yml`: спершу «Складання», потім
        # «Тести .NET», в одному завданні.
        run: dotnet build Ecr.sln -c Release --no-restore
      - name: test
        # Інтеграційні виключені СВІДОМО: вони вимагають SQL Server і живуть у
        # `ci.yml`, де контейнер піднімається кроком. Тут — швидкий гейт, який
        # має відповідати за хвилини, інакше його почнуть обходити.
        run: >
          dotnet test Ecr.sln -c Release --no-build --no-restore
          --filter "Category!=Integration"
          --logger 'console;verbosity=normal'

  honesty-guard:
    name: honesty-guard
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'dev/integration' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ⛔ На push (lane/**) у події немає pull_request.*, і сторож отримував
      # порожні BASE/HEAD: `git diff "..."` давав порожній diff, а скрипт
      # виходив нулем — зелений гейт, що нічого не перевірив. Тому на push і
      # workflow_dispatch база — merge-base з dev/integration (історія є:
      # fetch-depth: 0; на самій dev/integration база = вершина, і порожній
      # diff там чесний), а
      # порожня чи неіснуюча база — падіння, а не «змін у .cs немає».
      - name: honesty
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD_SHA="$PUSH_SHA"
            BASE_SHA="$(git merge-base origin/dev/integration "$HEAD_SHA" || true)"
            # push у dev/integration: merge-base = сама вершина (порожній diff, хибно зелений); база - попередня вершина
            if [ "$GITHUB_REF" = "refs/heads/dev/integration" ] && [ "$EVENT_NAME" = "push" ]; then
              BASE_SHA="$BEFORE_SHA"
              case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="";; esac
            fi
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::honesty-guard: порожня база або вершина (подія $EVENT_NAME, BASE_SHA='${BASE_SHA:-}', HEAD_SHA='${HEAD_SHA:-}'). Без бази сторож нічого не перевіряє — це падіння, а не зелений."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::honesty-guard: коміт $sha відсутній у чекауті — diff був би порожнім і гейт хибно зеленим."
              exit 1
            fi
          done
          echo "honesty-guard: $EVENT_NAME, база $BASE_SHA, вершина $HEAD_SHA"
          export BASE_SHA HEAD_SHA
          bash .github/guards/honesty-guard.sh
