# Прогони Playwright на живому стенді (`tools/e2e-stand.ps1`) у CI.
#
# ⛔ НЕ обов'язковий гейт: окремий workflow, до семи гейтів (`build`, `test`,
# `honesty-guard`, `server`, `client`, `a11y (dark)`, `a11y (light)`) не
# входить, `needs` не має. Мета — зняти з «Аудита» ~46-хвилинний локальний
# e2e на кандидаті й ганяти його паралельно з рев'ю.
#
# ⚠ Запуск лише двома шляхами, щоб не навантажувати чергу раннерів (аудит
# CI-черги 07.10, 43 queued):
#   — вручну (`workflow_dispatch`): будь-який `ref` і необов'язковий `grep`;
#   — PR, у якого head або base — `rc/**` (тижневий `rc/<дата>` → `main`).
# На `lane/**` і на кожен пуш у `dev/integration` — НЕ запускається.
#
# ⚠ Linux, а не Windows — той самий вибір і ті самі параметри, що в `smoke.yml`:
# SQL Server у контейнері, `-Login` (SQL-автентифікація), `-SmallFiles`
# (64 МБ замість 14 ГБ), `pwsh`.
#
# ✎ 2026-10-29 (lane/integ-e2e-shard): набір ішов ~55 хв одним стендом (з них 20 хв —
# `keyCommitGateLive.spec.ts`). Тепер він ділиться на ШАРДИ, кожен на СВОЄМУ раннері зі своїм
# SQL Server, своєю базою і своїм стендом (`tools/e2e-stand.ps1 -Shard k/M`):
#   plan  — читає `src/Ecr.Web/e2e/shard-plan.json` і видає матрицю (з `grep` — один шард: план
#           під ПОВНИЙ набір, а цільовий прогін і так короткий);
#   shard — `e2e-stand (shard k/M)`, паралельно, `fail-fast: false`;
#   e2e   — АГРЕГАТ з незмінним ім'ям `e2e-stand (linux)` (за ним стежать спостерігач
#           `cancel-when-closed`, сторожі й ruleset): зелений лише коли зелені `plan` і ВСІ шарди.
# Чому свій раннер, а не свої бази на одному: спецфайли міняють спільний документ стенда
# (кожен повертає його у базову лінію в `afterAll`), а на одному раннері три стенди ще й
# ділили б 2 ядра/7 ГБ — лише повільніші прогони. Об'єднання звітів не потрібне: артефакти
# `e2e-stand-report-shard-k` / `e2e-stand-logs-shard-k` окремі.

name: e2e-stand

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Гілка, тег або SHA, на якому ганяти стенд'
        required: true
        default: dev/integration
      grep:
        description: 'Фільтр назв прогонів Playwright (--grep); порожнє — увесь набір'
        required: false
        default: ''
  pull_request:
    branches: [ main, 'rc/**' ]

permissions:
  contents: read

concurrency:
  group: e2e-stand-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.grep || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  plan:
    name: e2e-stand (plan)
    # PR у `main` з `dev/integration` (і будь-який інший не-rc) — пропуск.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'rc/') ||
      startsWith(github.base_ref, 'rc/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || '' }}
          sparse-checkout: src/Ecr.Web/e2e/shard-plan.json
          sparse-checkout-cone-mode: false

      # Число шардів = 1 (шард 1 — решта) + кількість заявлених у плані. З `grep` — один шард.
      - name: Матриця шардів
        id: m
        env:
          GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            count=1
          else
            count=$(( $(jq '.claims | length' src/Ecr.Web/e2e/shard-plan.json) + 1 ))
          fi
          matrix="$(jq -cn --argjson c "$count" '{include: [range(1; $c + 1) | {shard: ., count: $c}]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "### e2e-stand: шардів $count" >> "$GITHUB_STEP_SUMMARY"

  shard:
    name: e2e-stand (shard ${{ matrix.shard }}/${{ matrix.count }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Що проганяється
        env:
          GREP: ${{ inputs.grep }}
        run: |
          {
            echo "### e2e-stand (shard ${{ matrix.shard }}/${{ matrix.count }})"
            echo "- коміт: \`$(git rev-parse HEAD)\`"
            echo "- подія: ${{ github.event_name }}"
            echo "- фільтр: \`${GREP:-увесь набір}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ Пароль генерується на кожен прогін і маскується — як у `smoke.yml`.
      - name: SQL Server у контейнері
        run: |
          set -euo pipefail
          SA="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$SA"
          echo "ECR_SQL_PASSWORD=$SA" >> "$GITHUB_ENV"
          docker run -d --name ecr-mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2019-latest

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Node ≥ 22.12 (vitest@5, Playwright ≥ 20) — як у `client` і `a11y`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      # ⚠ Дослівно як у `smoke.yml`.
      - name: sqlcmd
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor --batch --yes -o microsoft-prod.gpg
          sudo install -o root -g root -m 644 microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg
          rm microsoft-prod.gpg
          . /etc/os-release
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: SQL Server відповідає
        env:
          SQLCMDPASSWORD: ${{ env.ECR_SQL_PASSWORD }}
        run: |
          for i in $(seq 1 90); do
            if sqlcmd -S localhost,1433 -U sa -C -b -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server готовий за ${i} с."
              exit 0
            fi
            sleep 1
          done
          echo "::error::SQL Server не відповів за 90 с. Журнал контейнера:"
          docker logs ecr-mssql 2>&1 | tail -40
          exit 1

      - name: dotnet ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ⚠ Без restore `dotnet ef migrations script` у `setup-dev-db.ps1` падає з
      # `NETSDK1004` (див. `smoke.yml`).
      - name: dotnet restore
        run: dotnet restore Ecr.sln

      # ⚠ У свіжому чекауті `@playwright/test` не встановлений (CLAUDE.md).
      - name: npm ci
        working-directory: src/Ecr.Web
        run: npm ci

      - name: Браузер Playwright
        working-directory: src/Ecr.Web
        run: npx playwright install --with-deps chromium

      # Склад шарда за секунди, ДО розгортання бази: помилка плану (порожній шард, зникла заявка)
      # падає тут, а не через 6 хвилин підйому стенда.
      - name: Склад шарда
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: pwsh -File tools/e2e-stand.ps1 -ListOnly -Shard '${{ matrix.shard }}/${{ matrix.count }}' -Grep "$E2E_GREP"

      # ⚠ Порт 5080+k (Vite — 6080+k): свій у кожного шарда (раннери окремі, але так стенди
      # лишаються розрізненими й на одній машині); `setup-dev-db.ps1` піднімає застосунок для
      # сіду на 5099, стенд не має говорити з ним. База — `EcrE2ECi<k>`, файли — `-SmallFiles`
      # (64 МБ) у типовому каталозі інстансу контейнера: окремий `-DataPath` на раннері не потрібен.
      # ⛔ Пароль іде оточенням (`ECR_SQL_PASSWORD`), не аргументом; `grep` —
      # теж оточенням, щоб введений текст не потрапляв у командний рядок.
      - name: Стенд і прогони Playwright (e2e-stand.ps1)
        env:
          ECR_SQL_PASSWORD: ${{ env.ECR_SQL_PASSWORD }}
          E2E_GREP: ${{ inputs.grep }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/artifacts/e2e.results.json
        run: |
          mkdir -p artifacts
          pwsh -File tools/e2e-stand.ps1 \
            -Server 'localhost,1433' -Login sa -Database "EcrE2ECi${{ matrix.shard }}" -Port "$((5079 + ${{ matrix.shard }}))" \
            -SmallFiles -RequireFreeGb 0 -StartupTimeoutSec 180 \
            -Reporter 'list,html,json' -Shard '${{ matrix.shard }}/${{ matrix.count }}' -Grep "$E2E_GREP"

      - name: Звіт, трасування, знімки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-stand-report-shard-${{ matrix.shard }}
          path: |
            src/Ecr.Web/playwright-report/
            src/Ecr.Web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Журнали застосунку
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-stand-logs-shard-${{ matrix.shard }}
          path: |
            artifacts/e2e.*
            artifacts/setup-dev-db.api.log*
          retention-days: 14
          if-no-files-found: ignore

  # АГРЕГАТ. Ім'я `e2e-stand (linux)` НЕ змінювати: за ним стежить `cancel-when-closed`, на нього
  # посилаються сторожі (`CiE2eStandCancelTests`), CLAUDE.md і ruleset. Зелений лише коли `plan` і
  # ВСІ шарди `success`: шард, що впав, скасований чи пропущений, червонить агрегат.
  e2e:
    name: e2e-stand (linux)
    needs: [ plan, shard ]
    if: >-
      always() && (
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'rc/') ||
      startsWith(github.base_ref, 'rc/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Вердикт за шардами
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          {
            echo "### e2e-stand (linux): вердикт"
            echo "- plan: $PLAN"
            echo "- шарди: $SHARDS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN" != "success" ] || [ "$SHARDS" != "success" ]; then
            echo "::error::e2e-stand: plan=$PLAN, шарди=$SHARDS - потрібні success/success."
            exit 1
          fi

  # ✎ 2026-10-13 (ретро #8): прогін без споживача. GitHub НЕ скасовує вже запущений
  # run, коли PR змержено/закрито, а e2e іде 23-38 хв. Тому паралельний легкий
  # спостерігач раз на 60 с питає стан PR і, якщо він не `open`, скасовує цей run.
  # Не обов'язковий, до required-перевірок `main` не входить; на `e2e-stand (linux)`
  # не впливає (лише скасовує run, коли PR уже закрито). Припиняється, щойно
  # завершилось завдання `e2e-stand (linux)`.
  # ⚠ Лише PR із цього ж репозиторію: токен форків read-only (`actions: write` нема),
  # там скасування і так неможливе. Збій скасування не валить run (`|| true`).
  cancel-when-closed:
    name: e2e-cancel-when-closed
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'rc/') || startsWith(github.base_ref, 'rc/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    permissions:
      actions: write
      pull-requests: read
      contents: read
    steps:
      - name: Скасувати run, якщо PR закрито
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for _ in $(seq 1 150); do
            state="$(gh api "repos/$REPO/pulls/$PR" --jq .state 2>/dev/null || true)"
            if [ -n "$state" ] && [ "$state" != "open" ]; then
              echo "PR #$PR: стан '$state' - скасовую run $RUN_ID."
              gh run cancel "$RUN_ID" -R "$REPO" || true
              exit 0
            fi
            e2e="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name == "e2e-stand (linux)") | .status' 2>/dev/null || true)"
            if [ "$e2e" = "completed" ]; then
              echo "e2e-stand (linux) завершено - спостерігач не потрібен."
              exit 0
            fi
            sleep 60
          done
