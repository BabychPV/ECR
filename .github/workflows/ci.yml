# Конвеєр складання (`II.12`, `H-22` директиви №06, §4 директиви №07).
#
# ⛔ Гейти НЕ перелічені тут списком команд. Кожне завдання кличе
# `tools/verify-all.ps1 -Only '<крок>'` — той самий скрипт, що й у розробника.
# Два переліки перевірок розійшлися б на першій правці, і розбіжність була б
# видима не як помилка, а як зелений конвеєр на дереві, де перевірка вже не та.
#
# ⛔ `CiPipelineTests` звіряє об'єднання всіх `-Only` цього файла з переліком
# кроків скрипта. Крок, якого не бере жодне завдання і який не названий у
# `ci-exempt` нижче, робить тест червоним: «розділити на завдання» і «тихо
# викинути гейт» інакше виглядали б однаково.
#
# ⚠ Кроки, які конвеєр НЕ виконує, і чому — рядки читає сторож, формат значущий:
# ci-exempt: Наскрізний сценарій — через `verify-all` іде без параметрів, тобто під Windows-автентифікацією; у CI — окремий НЕобов'язковий workflow `smoke.yml` (SQL-логін, Linux-контейнер); не входить у три обов'язкові гейти `H-22`
# ci-exempt: Прогони в браузері — те саме плюс браузери Playwright; не входить у три обов'язкові гейти `H-22`
#
# ⛔ «Виведений із конвеєра» більше не означає «зелений задарма». Раніше
# `npm run test:e2e` без стенда виходив НУЛЕМ, виконавши 3 прогони з 20, і
# повернути крок сюди «в лоб» означало б додати зелений колір без жодної
# перевірки. Тепер набір без стенда ПАДАЄ (`src/Ecr.Web/e2e/globalSetup.ts`):
# підключити його одним рядком не вийде — або стенд, або нічого.
#
# ⚠ Сторож дрейфу маршрутів лежав у тих самих прогонах і тому не виконувався
# ні тут, ні локально. Він переїхав у vitest і йде в кроці «Тести клієнта».
#
# ⚠ Платформа — Linux, і це не вибір. Сервісні контейнери GitHub Actions
# працюють лише на Linux-раннерах, а гейт розгортання потребує SQL Server.

name: CI

on:
  push:
    branches: [ main, dev/integration, 'lane/**' ]
  pull_request:

  # ⚠ Розклад потрібен РІВНО одному завданню — `shuffle` (у кінці файла).
  # Решта гейтів його ігнорує: вони прив'язані до змін, а не до годинника,
  # і нічний прогін того самого коду нічого не додав би.
  schedule:
    - cron: '17 2 * * *'

  # Щоб перемішаний прогін можна було попросити руками, не чекаючи ночі.
  workflow_dispatch:

permissions:
  contents: read

# ⚠ Новий поштовх у ту саму гілку скасовує попередній прогін: інакше черга
# заповнюється відповідями на код, якого вже немає.
concurrency:
  # ✎ 2026-09-29 (пряме рішення людини): для push у dev/integration група за SHA — GitHub тримає в групі лише один очікуваний прогін, і новий витісняв попередній; тепер кожен пуш має свій вердикт
  # ✎ 2026-10-09 (D-335, L10-09): PR з dev/integration більше не має окремої групи — такий PR забороняє `pr-source`.
  group: ci-${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') && github.sha || github.ref }}
  # ✎ 2026-09-29 (пряме рішення людини): на dev/integration — не скасовувати,
  # щоб кожен пуш отримав власний вердикт; на lane/** — скасовувати, як і раніше.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev/integration') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ✎ 2026-10-13 (lane integ-ci-skip-dup, ретро координатора): push у `dev/integration`, вершина
  # якого УЖЕ в `main` (fast-forward `dev` до `main` після мержу тижневого PR), не має споживача:
  # дерево пройшло вісім гейтів у PR, а прогін ~22+ хв займає раннери. `gate` — крихітне завдання
  # без checkout: `compare/main...<sha>` дає `identical|behind`, коли SHA вже предок/рівний
  # `main` (семантика `git merge-base --is-ancestor`, без завантаження історії). Лише для
  # push у `refs/heads/dev/integration`; усе інше (lane/**, integ-*, PR, main, schedule,
  # dispatch) дає `skip=false`. Помилка API → `skip=false` (відкрито: краще зайвий прогін,
  # ніж пропущений). Важкі завдання мають `needs: gate` + `needs.gate.outputs.skip != 'true'`;
  # імена завдань і атестація не змінені (`attest` — лише PR rc/**, gate йому не потрібен).
  gate:
    name: gate
    # ubuntu-24.04 (не ubuntu-latest): Playwright 1.55.1 не підтримує Ubuntu 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        name: Вершина dev/integration уже в main?
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          skip=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/dev/integration" ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status || true)"
            echo "compare main...$SHA: ${status:-<порожньо>}"
            case "$status" in
              identical|behind) skip=true ;;
            esac
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # ⛔ Контейнер піднімається КРОКОМ, а не через `services:`, і секрету
  # репозиторію не потребує. Перша збірка вимагала `SQL_SA_PASSWORD` — і
  # конвеєр був червоний із першого дня в того, хто його не завів, причому
  # гейт розгортання при цьому не виконувався ЖОДНОГО разу. Тобто вимога
  # секрету не захищала нічого, а вимикала перевірку.
  #
  # ⚠ Пароль тут не таємниця: контейнер живе хвилини, доступний лише зсередини
  # агента і не тримає нічого, крім згенерованої схеми. Але сталим його
  # писати не можна — сталий пароль у файлі одного дня переїде туди, де він
  # уже щось означає. Тому він **генерується на кожен прогін** і ховається
  # через `::add-mask::`.
  #
  # ⚠ `services:` цього не вміє: службу оголошують до того, як виконався
  # перший крок, отже значення, обчислене в прогоні, туди не потрапляє.
  #
  # ⛔ Серверні гейти — ЧОТИРИ паралельні частини, а не одне завдання. Замір
  # 2026-09-27 (23 зелені прогони `dev/integration`): черга ≈ 0, підготовка
  # ≈ 0.7 хв, а 9–15 хв — один крок «Складання, тести, розгортання», і в ньому
  # хвіст — `Ecr.Api.Tests` (колекція `SqlServer`, послідовно, 5.7–9.2 хв),
  # ПІСЛЯ якого ще послідовно йшли сценарії (2.0–3.5 хв). Решта проєктів
  # закінчувала за ~2 хв. Тепер кожна частина складає рішення сама (~1–2 хв)
  # і бере свій шматок; вердикт ≈ складання + найдовша частина.
  #
  # ⚠ Кожна частина — власний агент і власний контейнер SQL Server, тож бази
  # частин не перетинаються. Збірка НЕ передається між завданнями
  # артефактом: вивантажити й завантажити `bin/` коштує стільки ж, скільки
  # скласти, а додає ще один шлях, яким у тест може приїхати не та DLL.
  #
  # ⛔ `fail-fast: false` — з тієї ж причини, що й `Step` у `verify-all.ps1`:
  # перевірки не зупиняють одна одну, інакше червона частина ховала б стан
  # решти.
  #
  # ✎ 2026-10-12 (CI-швидкість, «чекати стільки неприпустимо»): (1) `Ecr.Api.Tests`
  # — ЧОТИРИ частини (api-1…api-4) замість двох: замір 2026-10-12 давав 33 і 24 хв
  # на частину (сума тестів 2829 с, один процес на частину), тепер ~700 с суми
  # (≈ 18 хв стіни разом зі складанням). Склад — `tools/api-test-shards.psd1`,
  # повноту розбиття стереже `ApiTestShardsTests`. (2) На push у НЕ-інтеграційну
  # `lane/**` важкі завдання (server-part, client, a11y, windows) пропускаються —
  # там іде швидкий контур: Evidence (build + test + honesty-guard), `lane-affected`
  # (тести зачеплених тестових класів) і `lane-client` (клієнт, якщо чіпали
  # `src/Ecr.Web`). Повний набір — на `lane/integ-*`, `dev/integration`, `main`,
  # PR (у т.ч. `rc/*` → `main`) і вручну. Імена обов'язкових перевірок не змінено.
  server-part:
    needs: gate
    name: server-part (${{ matrix.part }})
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ⛔ Перелік кроків — ЛІТЕРАЛОМ `-Only '…'` у кожному рядку: саме так
        # його читає `CiPipelineTests`. Об'єднання чотирьох рядків мусить
        # дорівнювати колишньому одному, інакше сторож червоний.
        include:
          - part: core
            only: "-Only 'Складання','Ліцензії NuGet','Тести .NET','Розгортання під sqlcmd'"
          # ✎ 2026-10-19: `Ecr.Infrastructure.Tests.Persistence.*` винесено з `core` (там був
          # «хвіст» ~15 хв, job 19–20 хв). Дві частини — взаємні заперечення фільтра в
          # `verify-all.ps1`; складання повторюється в кожній (раннери ізольовані).
          - part: core-persistence
            only: "-Only 'Складання','Тести Infrastructure (Persistence)'"
          - part: scenarios
            only: "-Only 'Складання','Сценарії директиви №09 (довідково)'"
          - part: api-1
            only: "-Only 'Складання','Тести API (частина 1)'"
          - part: api-2
            only: "-Only 'Складання','Тести API (частина 2)'"
          - part: api-3
            only: "-Only 'Складання','Тести API (частина 3)'"
          - part: api-4
            only: "-Only 'Складання','Тести API (частина 4)'"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SQL Server у контейнері
        run: |
          set -euo pipefail
          # ⚠ Хвіст `Aa1!` — не прикраса: SQL Server вимагає три категорії
          # символів із чотирьох, і випадковий рядок їх не гарантує. Без
          # цього контейнер падає з «Password validation failed», що
          # читається як зламаний образ.
          SA="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$SA"
          echo "ECR_SQL_PASSWORD=$SA" >> "$GITHUB_ENV"
          docker run -d --name ecr-mssql             -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA"             -p 1433:1433 mcr.microsoft.com/mssql/server:2019-latest

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # ⚠ `sqlcmd` на розміщеному раннері не стоїть. Гейт розгортання існує
      # рівно тому, що DBA виконує скрипти НИМ, а не клієнтом .NET: підмінити
      # його на `SqlConnection` означало б перевіряти інший шлях (`P-17`).
      - name: sqlcmd
        run: |
          set -euo pipefail

          # ⛔ `--batch --yes` і БЕЗ `sudo` на самому `gpg`. Перший варіант
          # (`| sudo gpg --dearmor -o …`) упав на агенті з `cannot open
          # '/dev/tty'`: під `sudo` gpg вважає себе інтерактивним і шукає
          # термінал, якого в конвеєра немає. Ключ розбирається від імені
          # користувача, і лише готовий файл кладеться під root.
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc             | gpg --dearmor --batch --yes -o microsoft-prod.gpg
          sudo install -o root -g root -m 644 microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg
          rm microsoft-prod.gpg

          # ⛔ Випуск Ubuntu береться з `/etc/os-release`, а не зашитий. Тут
          # стояло `22.04/prod jammy`, а `ubuntu-latest` уже 24.04: зашите
          # число тихо старіє разом із образом агента, і наслідком буде не
          # «конвеєр застарів», а «репозиторій пакетів не знайдено».
          . /etc/os-release
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main"             | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

          # ⛔ Оновлюємо ЛИШЕ щойно доданий список mssql-release.list, а не
          # весь apt. Звичайний `apt-get update` чіпає і чужі репозиторії,
          # які раннер `ubuntu-latest` має заздалегідь (напр. Google Chrome
          # для дій, що вимагають браузера) — ми Chrome не використовуємо
          # ніде в цьому кроці, але тимчасове неспівпадіння хеша в НЬОГО вже
          # одного разу провалило встановлення sqlcmd (exit 100), яке з ним
          # не пов'язане ніяк. Прицільне оновлення одного джерела усуває цю
          # залежність від чужого репозиторію фізично, а не толерантністю до
          # флакі.
          sudo apt-get update             -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list"             -o Dir::Etc::sourceparts="-"             -o APT::Get::List-Cleanup="0"
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      # ⛔ Готовність контейнера чекається ЯВНО. `services` вважає службу
      # піднятою, щойно відповів порт, а SQL Server після цього ще хвилину
      # відновлює системні бази — і перший же `sqlcmd` падає з «login failed»,
      # що читається як неправильний пароль.
      - name: SQL Server відповідає
        env:
          SQLCMDPASSWORD: ${{ env.ECR_SQL_PASSWORD }}
        run: |
          for i in $(seq 1 90); do
            if sqlcmd -S localhost,1433 -U sa -C -b -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server готовий за ${i} с."
              exit 0
            fi
            sleep 1
          done
          echo "::error::SQL Server не відповів за 90 с. Журнал контейнера:"
          docker logs ecr-mssql 2>&1 | tail -40
          exit 1

      # ⛔ `verify-sql-scripts.ps1` кличе `dotnet ef migrations script`, а
      # глобальні інструменти .NET лягають у `~/.dotnet/tools`, якого в `PATH`
      # немає. Без цього рядка гейт розгортання падав би на «dotnet ef не є
      # командою» — тобто на відсутньому інструменті, а виглядало б це як
      # зламані міграції.
      - name: dotnet ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ✎ 2026-10-22: проба pwsh-ДИТИНИ. Run 39584163913 (ubuntu-24.04, образ 20261012.601):
      # кожен НОВИЙ процес pwsh падав SIGSEGV (exit 139) на старті, а батьківський жив, — тож
      # 347 архітектурних тестів, що запускають pwsh-дитину, червоніли «Expected 1/Actual 139»,
      # а «Розгортання під sqlcmd» виходило 139 за 0,6 с. Дефект раннера (~1 з 27 прогонів),
      # лікується перезапуском. Проба падає ОДРАЗУ з діагностикою замість сотень хибних
      # падінь тестів. Два підходи з паузою 1 с — щоб не червоніти на одиничному збої.
      # ⛔ Це лише проба: verify-all НЕ повторюється, а його коди 1 нічим не маскуються.
      # Деталі: .sync-local/reports/CI-PWSH-139-INVESTIGATION.md.
      - name: Проба pwsh-дитини (раннер)
        timeout-minutes: 2
        shell: bash
        run: |
          rc=0
          for attempt in 1 2; do
            rc=0
            pwsh -NoProfile -Command 'exit 0' || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "pwsh OK: $(pwsh --version) ${ImageOS:-?} ${ImageVersion:-?}"
              exit 0
            fi
            echo "Спроба ${attempt}: pwsh-дитина вийшла з кодом ${rc}."
            sleep 1
          done
          echo "::error::pwsh-дитина вийшла з кодом ${rc} - несправний раннер (див. CI-PWSH-139-INVESTIGATION). Перезапустіть job (gh run rerun --failed)."
          uname -a
          pwsh --version || true
          head -5 /etc/os-release
          ulimit -a
          free -m
          dmesg 2>/dev/null | tail -20 || true
          echo "Runner image: ${ImageOS:-?} ${ImageVersion:-?}"
          exit 1

      # ⛔ Три гейти — ОДИН виклик спільного скрипта. Кликати
      # `verify-sql-scripts.ps1` повз нього було б коротше і давало б такий
      # самий зелений прогін — але кожна наступна зміна в тому, ЯК скрипт
      # запускає гейт розгортання, до конвеєра вже не доходила б.
      #
      # ⚠ `sqlcmd` контейнера домену не знає, отже інтегрованої автентифікації
      # в нього немає — звідси `-SqlLogin`.
      #
      # ⛔ Пароль іде ОТОЧЕННЯМ (`ECR_SQL_PASSWORD`), а не аргументом: аргументи
      # процесу видно всім у переліку процесів агента. Скрипти читають цю
      # змінну самі, тож у командному рядку його немає взагалі.
      - name: Складання, тести, розгортання
        env:
          ECR_SQL_PASSWORD: ${{ env.ECR_SQL_PASSWORD }}
          ECR_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=${{ env.ECR_SQL_PASSWORD }};TrustServerCertificate=true'
        run: pwsh -File tools/verify-all.ps1 -SkipClient ${{ matrix.only }} -SqlServer 'localhost,1433' -SqlLogin sa

  # ⛔ Обов'язкова перевірка гілки називається `server` — і саме це завдання її
  # дає, зводячи чотири частини в один вердикт. Без нього захист гілки чекав
  # би `server`, якого більше немає, або (гірше) ім'я перенесли б на одну
  # частину, і три інші перестали б блокувати мерж.
  #
  # ⚠ `if: always()` — НЕ прикраса. Без нього при червоній частині це
  # завдання було б `skipped`, а пропущена обов'язкова перевірка GitHub
  # зараховує як пройдену: червона частина дала б зелений `server`.
  #
  # ✎ 2026-10-12: на push у не-інтеграційну `lane/**` частини пропущені навмисно, тож
  # агрегатор там теж пропускається (`skipped`), а не червоніє. На PR/dev/integration/
  # main/integ-* умова істинна й `server` рахує всі частини, як і раніше.
  server:
    needs: [ server-part, gate ]
    # ✎ 2026-10-12 (рев'ю атестації): на PR `rc/*` пропущене повне завдання створює check-run
    # `skipped` із ТИМ САМИМ іменем, що й атестація, і «пропущений близнюк» міг би перекрити
    # червону атестацію в обчисленні обов'язкових перевірок. Тому на rc-PR повне завдання
    # має ІНШЕ ім'я; на решті подій ім'я незмінне (його читає атестація й ruleset `main`).
    name: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && 'server (повний, пропущено на rc)' || 'server' }}
    if: ${{ always() && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Усі частини server зелені
        run: |
          echo "server-part: ${{ needs.server-part.result }}"
          if [ "${{ needs.server-part.result }}" != "success" ]; then
            echo "::error::Щонайменше одна частина server не зелена (${{ needs.server-part.result }})."
            exit 1
          fi

  client:
    needs: gate
    name: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && 'client (повний, пропущено на rc)' || 'client' }}
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ⚠ .NET тут НЕ ставиться. «Типи клієнта зі знімка» перегенеровує типи
      # з файла `contracts/openapi.snapshot.json`, який лежить у репозиторії, —
      # застосунок для цього не потрібен. Кроки складання і тестів `-Only`
      # відсіює до першої команди, тож `dotnet` не кличеться жодного разу.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      - name: npm ci
        working-directory: src/Ecr.Web
        run: npm ci

      # ⚠ Імена кроків не розриваються на кілька рядків: складений згин YAML
      # дав би те саме, але сторож і людина читали б різне, а помилку в
      # такому рядку видно лише за наслідком.
      - name: Гейти клієнта
        run: pwsh -File tools/verify-all.ps1 -SkipDeployment -Only 'Тести інструментів (Pester)','Безпека залежностей','Ліцензії npm','Аудит інструментів (довідково)','Типи клієнта зі знімка','Типи клієнта','Стиль клієнта','Тести клієнта','Збірка клієнта','Бюджет клієнта'

  # ⛔ Доступність — окремим завданням, і не для краси. `axe` у jsdom дає
  # близько 35 с на маршрут, і одна тема іде 16-23 хвилини. У складі
  # `client` вона тримала б решту гейтів заручниками; поруч — не тримає нікого.
  a11y:
    needs: gate
    name: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && 'a11y (повний, пропущено на rc)' || format('a11y ({0})', matrix.theme) }}
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    # ⚠ W4.3 (accessibility.a11y.test.tsx, коментар над ECR_A11Y_THEME) описував
    # матрицю light/dark як чинну — вона такою не була: ця джоба досі проганяла
    # ОБИДВІ теми ПОСЛІДОВНО в одному виклику Vitest (ECR_A11Y_THEME ніде не
    # задавався), тобто вдвічі довше за задум і за коментар нижче. Заведено тут:
    # кожна нога матриці бере рівно одну тему, обидві йдуть паралельно.
    strategy:
      matrix:
        theme: [light, dark]
    # ⚠ Замір на машині розробника: 975 с без конкуренції, 1372 с під
    # навантаженням — на ОДНІЙ темі (обхід той самий обсяг маршрутів, що й
    # раніше, не подвоєний). Межа взята з ЗАПАСОМ на слабший агент (два ядра
    # проти восьми), бо саме таймаут і був причиною хибно червоного гейта
    # (`Q-143`): ставити межу «в обріз» означало б відтворити ту саму ваду
    # на іншому рівні.
    #
    # ⛔ Межа тут — сторож проти ЗАВИСАННЯ, а не мірило швидкості. Якщо
    # прогін підбереться до неї, правильна відповідь — розділити обхід на
    # завдання, а не підняти число ще раз.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      - name: npm ci
        working-directory: src/Ecr.Web
        run: npm ci

      - name: "Доступність (${{ matrix.theme }})"
        env:
          ECR_A11Y_THEME: ${{ matrix.theme }}
        run: pwsh -File tools/verify-all.ps1 -SkipDeployment -Only 'Доступність клієнта'

  # ⚠ Job Object (ФВ-9.8, D-206) існує лише у Windows. На `ubuntu-latest`
  # `Ecr.Worker.Tests` перевіряють лише зрозумілу відмову
  # `PlatformNotSupportedException`, а самі межі пам'яті й KILL_ON_JOB_CLOSE —
  # ніде. Це завдання ганяє той самий проєкт на Windows, де гілки тестів із
  # живими процесами справді виконуються. SQL не потрібен (крім кроку L2-09, Y6-03).
  #
  # ⚠ Тому `--filter "Category!=Integration"`: SQL-тести дочірнього воркера
  # (I1, `[Collection("SqlServer")]`) без `ECR_TEST_SQL` тут упали б. Вони
  # ідуть у `server-part (core)` — крок «Тести .NET» ганяє весь `Ecr.sln`
  # із SQL у контейнері.
  #
  # ⛔ Y6-03 (R7): але `WorkerSupervisorStopTests` (L2-09: справжній `--child`,
  # Job Object, сигнал зупинки, повернення задачі в чергу, код виходу 0) на
  # Linux одразу повертається, а тут його відкидав той самий фільтр — тобто
  # не виконувався НІДЕ, і «доказ 20/20» у WORK-QUEUE AN-82 не мав прогону
  # (це й сховало Y6-02). Тому окремий крок нижче: SQL Server LocalDB на
  # раннері (фікстура сама створює й розгортає базу за `ECR_TEST_SQL`) і
  # прогін саме цього класу. Повний набір інтеграційних тестів воркера
  # лишається в `server-part (core)`.
  #
  # ⛔ НЕ обов'язковий гейт (пряме рішення людини 2026-09-29): до переліку
  # семи не входить, у `server` не зводиться, `needs` не має — іде паралельно.
  # ✎ X8-01 (R6): зводиться в агрегатор `windows` (кінець Windows-блоку) —
  # одне ім'я для ruleset `main`, коли людина вирішить зробити його обов'язковим.
  # Кроки перевірки тут не з `verify-all.ps1`, тож `CiPipelineTests` його не
  # зачіпає.
  worker-windows:
    needs: gate
    name: worker (windows)
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Тести Ecr.Worker (Job Object)
        run: dotnet test tests/Ecr.Worker.Tests --nologo --filter "Category!=Integration" --logger "trx;LogFileName=worker-windows.trx" --logger "console;verbosity=normal" --results-directory TestResults

      # Y6-03: LocalDB — якщо образ раннера її не несе, ставимо з Chocolatey (є на windows-latest).
      - name: SQL Server LocalDB (Y6-03)
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install sqllocaldb: код $LASTEXITCODE" }
            $tools = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' | Select-Object -First 1
            if (-not $tools) { throw 'SqlLocalDB.exe не знайдено після встановлення' }
            $env:PATH = "$($tools.DirectoryName);$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $tools.DirectoryName
          }
          # Автоматичний екземпляр MSSQLLocalDB `start` створює сам, якщо його ще немає.
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw "sqllocaldb start: код $LASTEXITCODE" }
          sqllocaldb info MSSQLLocalDB

      # Y6-03: доказ L2-09 на справжньому `--child` — саме цей клас, з SQL.
      - name: Тести Ecr.Worker (L2-09, справжній --child + SQL)
        env:
          ECR_TEST_SQL: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true'
        run: dotnet test tests/Ecr.Worker.Tests --nologo --filter "FullyQualifiedName~WorkerSupervisorStopTests" --logger "trx;LogFileName=worker-windows-l2-09.trx" --logger "console;verbosity=normal" --results-directory TestResults

      # L10-05: на Linux-раннері сценарій deploy-ecr.ps1 іде через pwsh 7, який ПРИЙМАЄ коментарі в JSON, —
      # тож «5.1 не читає JSONC» там не доводиться. Цей крок запускає ту саму перевірку у вбудованому Windows
      # PowerShell 5.1 (%WINDIR%\System32\WindowsPowerShell\v1.0\powershell.exe).
      - name: Скрипт розгортання у Windows PowerShell 5.1 (L10-05)
        run: dotnet test tests/Ecr.Architecture.Tests --nologo --filter "FullyQualifiedName~DeployWorkerModeTests" --logger "trx;LogFileName=deploy-ps51-windows.trx" --logger "console;verbosity=normal" --results-directory TestResults

  # ⚠ MSI (installer/Ecr.Installer, WiX 5) не збирається ніде в CI: WiX не має
  # збірки під Linux, тож `tools/build-msi.ps1` досі йшов лише руками на
  # машині збірки. Після Worker.wxs (служба EcrWorker, ФВ-9.8, D-206) склад
  # MSI змінився, і без цього завдання про поламаний .wxs дізналися б на
  # машині адміністратора. Тут: WiX 5.0.2 як dotnet tool — ЛИШЕ на ранері
  # (розширення Util/UI/Firewall тягне сам .wixproj через NuGet), повна
  # збірка `build-msi.ps1` (Api + Worker + веб-клієнт) і `verify-msi.ps1
  # -StaticOnly` (S1–S5: таблиці MSI, без установки).
  #
  # ⛔ НЕ обов'язковий гейт (пряме рішення людини 2026-09-29): до переліку
  # семи не входить, у `server` не зводиться, `needs` не має — іде паралельно.
  # ✎ X8-01 (R6): зводиться в агрегатор `windows` (кінець Windows-блоку) —
  # одне ім'я для ruleset `main`, коли людина вирішить зробити його обов'язковим.
  # Кроки перевірки тут не з `verify-all.ps1`, тож `CiPipelineTests` його не
  # зачіпає.
  msi-windows:
    needs: gate
    name: msi (windows)
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      - name: WiX 5.0.2 (dotnet tool, лише ранер)
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version

      # ⚠ Версія — три поля (MSI порівнює лише їх); 0.0.<run_number> лише
      # для перевірки збірки, не для випуску.
      - name: Збірка MSI (build-msi.ps1)
        run: pwsh -File tools/build-msi.ps1 -Version "0.0.${{ github.run_number }}"

      - name: Перевірка MSI (verify-msi.ps1 -StaticOnly)
        run: |
          $msi = Get-ChildItem artifacts/msi -Filter '*.msi' -Recurse | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $msi) { throw 'MSI не знайдено в artifacts/msi' }
          Write-Host ("MSI: {0} ({1:N1} MB)" -f $msi.FullName, ($msi.Length / 1MB))
          pwsh -File tools/verify-msi.ps1 -MsiPath $msi.FullName -StaticOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # CL-3 (MSI-SIGNING-OPTIONS (A+B)): цілісність пакета — I1 SHA-256 і I2 підпис на справжньому
      # Ecr.msi: непідписаний, підписаний тимчасовим самопідписаним
      # сертифікатом, пошкоджений (мають впасти і хеш, і підпис), підмінений
      # із переписаним хешем. Довіра до тимчасового сертифіката ставиться в
      # LocalMachine і знімається — ранер ефемерний.
      - name: Перевірка цілісності MSI (test-verify-msi.ps1)
        run: |
          $msi = Get-ChildItem artifacts/msi -Filter '*.msi' -Recurse | Sort-Object LastWriteTime | Select-Object -Last 1
          pwsh -File tools/test-verify-msi.ps1 -MsiPath $msi.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # ⚠ Єдине доповнення цієї джоби для `msi-install (windows)`: MSI
      # артефактом — для реальної установки в тому ж прогоні і як «попередня
      # MSI» для наступних (оновлення, W3/W3b). 30 днів — вистачає на тижневий
      # цикл мержу.
      - name: Артефакт MSI (ecr-msi)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecr-msi
          # .sha256 — еталон для I1 у verify-msi.ps1 (повний режим у msi-install).
          path: |
            artifacts/msi/**/*.msi
            artifacts/msi/**/*.msi.sha256
          if-no-files-found: error
          retention-days: 30

  # ⚠ РЕАЛЬНА установка MSI (пряме рішення людини 2026-09-30): ефемерний
  # windows-latest, справжній msiexec і служби. `tools/ci-msi-install.ps1`:
  # verify-msi.ps1 без -StaticOnly (свіжа установка — EcrWorker є, Auto +
  # DelayedAutoStart; WORKER_ENABLED=0 — служби нема; оновлення з попередньої
  # MSI — артефакт `ecr-msi` останнього прогону dev/integration чи main через
  # `gh`), `deploy-ecr.ps1 -WhatIf` і функції кроку 5 deploy-ecr.ps1 проти
  # справжнього реєстру служби (Mode=Database/Executor=Worker за наявної
  # EcrWorker, InProcess без неї).
  # ⚠ Служби НЕ стартують: SQL на ранері немає, SERVICE_ACCOUNT порожній —
  # зареєстровані, але зупинені (10-installer.md §1.4). Старт і /health тут
  # не перевіряються.
  #
  # ⛔ НЕ обов'язковий гейт (як `msi (windows)`): до переліку семи не входить,
  # у `server` не зводиться. `needs` — лише заради артефакту поточної MSI.
  # ✎ X8-01 (R6): зводиться в агрегатор `windows` нижче.
  # Кроки перевірки не з `verify-all.ps1`, тож `CiPipelineTests` його не
  # зачіпає.
  msi-install:
    name: msi-install (windows)
    needs: msi-windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read      # gh api / gh run download — артефакт попередньої MSI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Поточна MSI (артефакт ecr-msi)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ecr-msi
          path: msi-current

      - name: Реальна установка MSI (ci-msi-install.ps1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -File tools/ci-msi-install.ps1 -MsiDir msi-current -LogDir "$env:RUNNER_TEMP\msi-logs" -DiscoverPrevious
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Журнали msiexec (/l*v) і deploy -WhatIf
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-install-logs
          path: ${{ runner.temp }}/msi-logs
          retention-days: 14

  # ⛔ X8-01 (аудит R6): Windows-завдання — єдиний автоматичний доказ того, що
  # постачається замовнику (MSI на Windows Server, служби EcrApi/EcrWorker, Job
  # Object, deploy-ecr.ps1 під PowerShell 5.1, D-101). Сім гейтів ідуть на Linux і
  # цього не бачать: червоний `msi-install` не блокував би PR `rc/<дата>` → `main`.
  #
  # ⚠ Агрегатор, а не три імені в ruleset — той самий прийом, що `server` для
  # `server-part`: перелік Windows-завдань змінюється тут, у файлі, а не в
  # налаштуваннях GitHub. Обов'язковим для `main` його робить ЛЮДИНА (Settings →
  # Rules → `windows`); до того він лише зводить три вердикти в один видимий.
  # `CiPipelineTests.Агрегатор_windows_залежить_від_усіх_Windows_завдань` стереже
  # склад `needs`.
  #
  # ⚠ `if: always()` — як у `server`: без нього червоне завдання дало б `skipped`,
  # а пропущену обов'язкову перевірку GitHub зараховує як пройдену.
  windows:
    name: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && 'windows (повний, пропущено на rc)' || 'windows' }}
    needs: [ worker-windows, msi-windows, msi-install, gate ]
    # ✎ 2026-10-12: на push у не-інтеграційну `lane/**` Windows-завдання пропущені навмисно — агрегатор теж.
    if: ${{ always() && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-')) && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/')) && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Усі Windows-завдання зелені
        run: |
          echo "worker-windows: ${{ needs.worker-windows.result }}"
          echo "msi-windows: ${{ needs.msi-windows.result }}"
          echo "msi-install: ${{ needs.msi-install.result }}"
          for r in "${{ needs.worker-windows.result }}" "${{ needs.msi-windows.result }}" "${{ needs.msi-install.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Windows-завдання не зелене ($r): MSI, служби чи Job Object не доведені."
              exit 1
            fi
          done

  # ⛔ ✎ 2026-10-12 (CI-швидкість, `lane/integ-ci-speed-2`): АТЕСТАЦІЯ на PR `rc/**` → `main`.
  # Тижневий `rc/<дата>` нарізається з SHA, на якому повний CI вже пройшов як push
  # (`lane/integ-*`, `dev/integration`) — повторювати той самий прогін на `pull_request`
  # (23 завдання в черзі, години) нічого не доводить. Але «просто пропустити» нема чим:
  # пропущену обов'язкову перевірку GitHub зараховує як пройдену, тож `rc`, нарізаний з SHA,
  # що ніколи не мав повного CI, замержився б неперевіреним.
  #
  # ⚠ Тому на PR з `rc/**` важкі завдання (`server-part`, `server`, `client`, `a11y`,
  # `worker-windows`, `msi-windows`, `windows`) НЕ запускаються (умова на `github.head_ref`),
  # а замість них іде це завдання з ТИМИ САМИМИ іменами (`name: ${{ matrix.check }}` —
  # `server`, `client`, `a11y (light)`, `a11y (dark)`, `windows`). Воно за хвилину питає
  # Actions API, чи є на ТОМУ САМОМУ head SHA ЗАВЕРШЕНИЙ УСПІШНИЙ job з цим іменем у цьому
  # workflow на події НЕ-PR (push / workflow_dispatch / schedule) або на PR не з `rc/**`.
  # Немає — червоне з поясненням. Імена обов'язкових перевірок не змінено; умови `if`
  # атестації й важких завдань протилежні, тож на одній події працює рівно одне з двох.
  #
  # ⚠ Чому Actions API (`actions: read`), а не `commits/{sha}/check-runs`: check-run не
  # каже, з якої ПОДІЇ він, і зелений check-run `server` від ІНШОГО PR `rc/*` на тому ж SHA
  # (тобто сама атестація!) виглядав би як «повний прогін». Прогони ж мають `event`.
  #
  # ⚠ Вирішує НАЙНОВІШИЙ завершений (success / failure / timed_out) за `completed_at`;
  # `cancelled`/`skipped` не рахуються ні за, ні проти. Якщо повний прогін ще йде —
  # атестація чекає до ATTEST_WAIT_MIN хв (опитування раз на 90 с), а не червоніє хибно.
  # Копія цього скрипта — у `evidence.yml` (`build`, `test`); сторож
  # `CiAttestationTests` вимагає, щоб вони збігалися дослівно.
  attest:
    name: ${{ matrix.check }}
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'rc/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        check: [ 'server', 'client', 'a11y (light)', 'a11y (dark)', 'windows' ]
    steps:
      - name: Є зелений повний прогін на цьому SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ matrix.check }}
          WORKFLOW_FILE: ci.yml
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ATTEST_WAIT_MIN: '10'
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::атестація «$CHECK»: порожній head SHA PR."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::атестація «$CHECK»: PR із форка ($HEAD_REPO) — повний CI на чужому SHA не атестується."
            exit 1
          fi
          deadline=$(( $(date +%s) + ATTEST_WAIT_MIN * 60 ))
          while true; do
            : > found.jsonl
            runs="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch" or .event == "schedule" or (.event == "pull_request" and (((.head_branch // "") | startswith("rc/")) | not))) | .id')"
            for run_id in $runs; do
              gh api --paginate "repos/$REPO/actions/runs/$run_id/jobs?per_page=100&filter=latest" \
                | jq -c --arg n "$CHECK" '.jobs[] | select(.name == $n) | {run_id, status, conclusion, completed_at, url: .html_url}' >> found.jsonl
            done
            latest="$(jq -rs '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out"))] | sort_by(.completed_at) | last // empty | "\(.conclusion) \(.url)"' found.jsonl)"
            pending="$(jq -s '[.[] | select(.status != "completed")] | length' found.jsonl)"
            total="$(jq -s 'length' found.jsonl)"
            case "$latest" in
              success*)
                echo "атестація «$CHECK»: на SHA $HEAD_SHA є зелений повний прогін — ${latest#success }"
                exit 0
                ;;
            esac
            if { [ "$pending" -gt 0 ] || [ "$total" -eq 0 ]; } && [ "$(date +%s)" -lt "$deadline" ]; then
              echo "повний прогін «$CHECK» на $HEAD_SHA ще не завершився (знайдено: $total, у процесі: $pending) — чекаю 90 с"
              sleep 90
              continue
            fi
            break
          done
          echo "::error::немає зеленого повного прогону «$CHECK» на SHA $HEAD_SHA (знайдено завдань: $total, у процесі: $pending, останній завершений: ${latest:-немає}); запусти lane/integ-… з цим SHA або workflow_dispatch на ньому, а потім перезапусти цю перевірку."
          exit 1

  # ⛔ Набір у ПЕРЕМІШАНОМУ порядку — і це НЕ восьмий гейт. Він не блокує
  # мерж (`continue-on-error`), бо його призначення інше: показати, що набір
  # зелений ПО СУТІ, а не тому, що штатний порядок випадково влаштовує
  # кожен тест.
  #
  # ⚠ Привід конкретний. 2026-09-18 прогін із `--sequence.shuffle` знайшов
  # ДВІ залежності від порядку, і одна з них вивела на дефект ПРОДУКТУ:
  # `RouteAnnouncer` тримав пам'ять про оголошений заголовок у модульній
  # змінній, яку ніщо не скидало, тож після перемонтування області читалка
  # екрана мовчала. Обидві були невидимі рівно стільки, скільки існували, —
  # штатний порядок їх не зачіпав.
  #
  # ⚠ Сід ВИПАДКОВИЙ на кожен прогін, а не сталий. Сталий сід перевіряв би
  # один-єдиний порядок і з часом став би просто другою копією штатного;
  # випадковий щоночі бере новий, і залежність рано чи пізно спливає.
  # Сід друкується в лог — саме ним падіння відтворюється локально:
  # `npx vitest run --sequence.shuffle --sequence.seed=<сід>`.
  #
  # ⛔ Лише за розкладом і вручну, НЕ на кожен PR: перемішаний прогін
  # червоніє випадково за побудовою, і в обов'язкових гейтах він навчив би
  # перезапускати червоне замість читати його.
  shuffle:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      - name: npm ci
        working-directory: src/Ecr.Web
        run: npm ci

      - name: Набір у перемішаному порядку
        working-directory: src/Ecr.Web
        run: |
          SEED=$RANDOM
          echo "Сід перемішування: $SEED"
          echo "Відтворити локально: npx vitest run --sequence.shuffle --sequence.seed=$SEED"
          npx vitest run --sequence.shuffle --sequence.seed=$SEED

  # ⛔ ✎ 2026-10-09 (D-335, HU-12 R5 = A; L10-09): PR з `dev/integration` заборонено.
  # Раніше (057a1118) гейти ci.yml/evidence.yml на такому PR ПРОПУСКАЛИСЯ, щоб не дублювати
  # push-прогін тієї ж вершини, а пропущену обов'язкову перевірку GitHub зараховує як
  # пройдену — вердикт PR тримався лише на тому, що push-прогін тієї ж SHA ще існує.
  # Тепер гейти йдуть на кожному PR без винятків, а дублювання прибрано в джерелі: тижневий
  # PR іде з нерухомої реліз-гілки `rc/*` (CLAUDE.md §8), на яку push-прогону ci.yml немає.
  # PR з `dev/integration` цей джоб валить з поясненням; щоб він блокував мерж, а не лише
  # червонів, `pr-source` треба додати в обов'язкові перевірки `main`.
  pr-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'dev/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: PR з dev/integration заборонено
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "::error::PR з dev/integration в $BASE_REF заборонено (D-335, CLAUDE.md §8): тижневий PR — з нерухомої реліз-гілки rc/<дата>. Закрий цей PR, створи rc/<дата> від перевіреної вершини dev/integration і відкрий PR з неї."
          exit 1

  # ✎ 2026-10-01 (рішення людини): необов'язкова перевірка ФОРМИ lane-гілки.
  # Лише попередження/notice, завжди зелена; жодних `needs:` ні від, ні на неї —
  # сім гейтів не змінюються. paths-ignore не додано: Actions застосовує його до
  # всіх гілок `push` (включно з main), ризик пропущених обов'язкових перевірок.
  lane-shape:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/')
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Форма lane-гілки (лише попередження)
        run: |
          git fetch origin dev/integration || true
          BASE=origin/dev/integration
          MERGES=$(git rev-list --merges "$BASE..HEAD" | wc -l)
          if [ "$MERGES" -gt 0 ]; then
            echo "::warning::lane містить merge-коміти ($MERGES); має бути лінійною"
          fi
          if git log -1 --format=%B | grep -qiE 'мутац|відкат|revert|mutation|доказ-мутац'; then
            echo "::warning::кінчик lane схожий на мутаційний доказ/відкат; мутація лише в локальному worktree"
          fi
          BEHIND=$(git rev-list --count "HEAD..$BASE")
          if [ "$BEHIND" -gt 50 ]; then
            echo "::warning::база відстає від dev/integration на $BEHIND комітів (>50); створи lane від свіжого tip"
          fi
          HOT=$(git diff --name-only "$BASE...HEAD" | grep -E '(^|/)(Sql/|Migrations/|openapi\.snapshot\.json|schema\.d\.ts|shared/ui/|package(-lock)?\.json|Directory\.Packages\.props|CLAUDE\.md|\.github/)' || true)
          if [ -n "$HOT" ]; then
            echo "::notice::гарячі файли в діфі: $(echo "$HOT" | tr '\n' ' ')"
          fi
          exit 0

  # ✎ 2026-10-12 (CI-швидкість): швидкий контур для push у НЕ-інтеграційну `lane/**`.
  # Повний набір (server-part ×4, client, a11y, windows) там пропущено; його ганяють
  # `lane/integ-*`, `dev/integration`, PR у `main` (в т.ч. `rc/*`). Цей контур разом з
  # Evidence (build + test + honesty-guard) тримає ≤ ~12 хв: тести лише ТЕСТОВИХ КЛАСІВ,
  # змінених у diff проти `origin/dev/integration` (`tools/ci-lane-affected.ps1`), включно з
  # інтеграційними (SQL у контейнері). Зміна лише в `src/**` без тестів іде через Evidence
  # (усі тести `Category!=Integration`), а інтеграційні покриває повний набір на integ/rc.
  # ⛔ Не обов'язковий гейт: ні в `server`, ні в ruleset `main` не входить.
  lane-affected:
    name: lane-affected
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: План (змінені тестові класи)
        id: plan
        shell: pwsh
        run: pwsh -File tools/ci-lane-affected.ps1 -Plan

      - name: SQL Server у контейнері
        if: steps.plan.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          SA="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$SA"
          echo "ECR_SQL_PASSWORD=$SA" >> "$GITHUB_ENV"
          docker run -d --name ecr-mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2019-latest

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: steps.plan.outputs.has_work == 'true'
        with:
          global-json-file: global.json

      - name: Тести зачеплених класів
        if: steps.plan.outputs.has_work == 'true'
        env:
          ECR_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=${{ env.ECR_SQL_PASSWORD }};TrustServerCertificate=true'
        run: pwsh -File tools/ci-lane-affected.ps1 -Run

  # ✎ 2026-10-12: клієнт на lane-пуші — лише якщо diff чіпає `src/Ecr.Web` або `contracts/`
  # (швидкий підмножинний набір: типи, стиль, vitest; без `npm audit`, збірки й бюджету — вони
  # на integ/rc). Не обов'язковий гейт.
  lane-client:
    name: lane-client
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lane/') && !startsWith(github.ref, 'refs/heads/lane/integ-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Чи чіпає diff клієнт
        id: diff
        run: |
          git fetch origin dev/integration || true
          BASE="$(git merge-base origin/dev/integration HEAD)"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(src/Ecr\.Web/|contracts/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::diff не чіпає src/Ecr.Web і contracts/ — тести клієнта пропущено"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.diff.outputs.web == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Ecr.Web/package-lock.json

      - name: npm ci
        if: steps.diff.outputs.web == 'true'
        working-directory: src/Ecr.Web
        run: npm ci

      - name: Швидкі гейти клієнта
        if: steps.diff.outputs.web == 'true'
        run: pwsh -File tools/verify-all.ps1 -SkipDeployment -Only 'Типи клієнта зі знімка','Типи клієнта','Стиль клієнта','Тести клієнта'