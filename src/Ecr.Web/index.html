<!doctype html>
<!--
  ⛔ `lang` — `en`, не `uk`. Українська тут була помилкою: мови продукту —
  `en`/`ru`/`kk` (`sys.Language`), української серед них немає взагалі, а
  зчитувач екрана озвучує вміст саме за цим атрибутом і читав би англійський
  інтерфейс українськими правилами вимови. Українська в цьому проєкті —
  робоча мова розробки, не мова інтерфейсу.

  ⚠ `en` — мова за замовчуванням. Коли користувач перемикає мову, атрибут
  має оновлюватися разом із каталогом; поки що цього не відбувається —
  окрема задача, і вона названа в описі PR, а не прихована.
-->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
