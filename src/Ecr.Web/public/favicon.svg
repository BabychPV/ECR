<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ECR Web">
  <!--
    Фірмовий знак для вкладки браузера.

    ⛔ Це НЕ та сама геометрія, що в BrandMark.tsx, і так навмисно. Знак у
    шапці живе на тлі сторінки й бере кольори з теми; тут навпаки —
    потрібна власна підкладка, бо вкладка браузера не має гарантованого
    тла, а прозорий знак темної теми зникає на темній вкладці.

    ⚠ Проміжки й радіуси збільшені відносно смуг: на 16 CSS-пікселях
    (типовий favicon) дрібніші зазори зливаються, і три смуги читаються як
    одна пляма. Середня смуга коротша за решту й іншого відтінку — два
    незалежні сигнали замість одного.

    ⚠ prefers-color-scheme: підкладка світлішає в темній темі, щоб знак не
    зливався з темною смугою вкладок.
  -->
  <style>
    .bg { fill: #f5f0ff; }
    .bar { fill: #1f2d75; }
    .mid { fill: #5a56bd; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f2d75; }
      .bar { fill: #e9e2f8; }
      .mid { fill: #847dca; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <rect class="bar" x="7" y="8" width="18" height="4.5" rx="1.75" />
  <rect class="mid" x="7" y="14.75" width="10" height="4.5" rx="1.75" />
  <rect class="bar" x="7" y="21.5" width="18" height="4.5" rx="1.75" />
</svg>
